<!DOCTYPE html>
<html lang="en">
<head>
    <title>Request a pattern</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylehomepage.css">
    <link rel="stylesheet" href="styleaboutpage.css">
    <link rel="stylesheet" href="stylerequestpage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container-fluid px-5 d-flex align-items-center">
        <a class="navbar-brand p-0" href="homepage.html">
            <img src="logo.png" alt="Crochet Crafts logo" class="logo-image">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link nav-item-custom" href="about.html">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-item-custom" href="projects.html">Projects</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-item-custom" href="beginners-guide.html">Beginners Guide</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-item-custom" href="request.html">Request Pattern</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</nav>

<section class="request-hero">
    <div class="container">
        <div class="request-hero-content">
            <h1>🧶 Request a Custom Pattern</h1>
            <p>
                Can't find what you're looking for?
                Tell us your dream crochet idea and we'll create something just for you!
            </p>
        </div>
    </div>
</section>

<div class="request-form">
    
    <div class="form-row">
        <div class="form-group">
            <label>Your Name *</label>
            <input type="text" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label>Email Address *</label>
            <input type="email" placeholder="Enter your email">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Category *</label>

            <select>
                <option>Select a category</option>
                <option>Plushies</option>
                <option>Flowers</option>
                <option>Bags</option>
                <option>Accessories</option>
            </select>
        </div>

        <div class="form-group">
            <label>Preferred Colours</label>
            <input type="text" placeholder="Pink, White, Green...">
        </div>
    </div>

    <div class="form-group">
        <label>Reference Image</label>
        <input type="file">
    </div>

    <div class="form-group">
        <label>Describe Your Idea *</label>

        <textarea placeholder="Tell us what you'd like us to crochet..."></textarea>
    </div>

    <button class="submit-btn">
        Submit Request
    </button>

</div>
    
<footer class="footer">
        <h3>Follow Us!</h3>
        <div class="footer-social">
            <a href="https://instagram.com" class="fa-brands fa-instagram">Instagram</a>
            <a href="https://facebook.com" class="fa-brands fa-facebook">Facebook</a>
            <a href="https://pinterest.com" class="fa-brands fa-pinterest">Pinterest</a>
        </div>
        <div class="footer-bottom">
            © 2026 Crochet Crafts
        </div>
    </footer>

</body>
</html>
